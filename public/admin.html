<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Dia do Administrador</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <a href="/api/admin/exportar" target="_blank"></a>
    <style>
        :root {
            --fundo-escuro: #0a0a0a;
            --fundo-card: #141414;
            --azul-senai: #005baa;
            --vermelho-senai: #e3000f;
            --texto-claro: #f0f4f8;
            --texto-mutado: #888888;
            --borda: #2a2a2a;
            --card-blue: rgba(0, 91, 170, 0.15);
            --card-green: rgba(34, 197, 94, 0.15);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--fundo-escuro);
            color: var(--texto-claro);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .dashboard-container { width: 100%; max-width: 1200px; }

        .header-dash {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        h1 { margin: 0; font-size: 28px; font-weight: 800; }
        .badge-admin { background-color: var(--azul-senai); color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card-resumo {
            background-color: var(--fundo-card);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-resumo.azul { border-top: 4px solid var(--azul-senai); background: linear-gradient(180deg, var(--card-blue) 0%, transparent 100%); }
        .card-resumo.verde { border-top: 4px solid #22c55e; background: linear-gradient(180deg, var(--card-green) 0%, transparent 100%); }

        .card-titulo { color: var(--texto-mutado); font-size: 14px; font-weight: 600; text-transform: uppercase; }
        .card-valor { font-size: 36px; font-weight: 800; color: white; margin: 0; }

        .tabela-container {
            background-color: var(--fundo-card);
            border: 1px solid var(--borda);
            border-radius: 16px;
            overflow-x: auto;
        }

        table { width: 100%; border-collapse: collapse; text-align: left; }
        
        thead th {
            background-color: #1a1a1a;
            color: var(--texto-mutado);
            font-size: 12px;
            text-transform: uppercase;
            padding: 20px;
            border-bottom: 1px solid var(--borda);
        }

        tbody td {
            padding: 20px;
            border-bottom: 1px solid var(--borda);
            font-size: 14px;
            color: var(--texto-claro);
        }

        tbody tr:hover { background-color: #1c1c1c; }
        tbody tr:last-child td { border-bottom: none; }

        .status-badge {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
        }

        /* Botão de Excluir */
        .btn-deletar {
            background: rgba(227, 0, 15, 0.15);
            border: 1px solid var(--vermelho-senai);
            color: #ff6b6b;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .btn-deletar:hover {
            background: var(--vermelho-senai);
            color: white;
        }

        .btn-refresh {
            background-color: transparent; border: 1px solid var(--borda); color: var(--texto-claro);
            padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: 600; transition: 0.3s;
        }
        .btn-refresh:hover { background-color: var(--borda); }
    </style>
</head>
<body>

    <div class="dashboard-container">
        
        <div class="header-dash">
            <div>
                <h1>Gestão de Inscrições</h1>
                <p style="color: var(--texto-mutado); margin-top: 5px;">Acompanhe os dados do evento em tempo real.</p>
            </div>
            <div>
                <span class="badge-admin">Modo Administrador</span>
                <button class="btn-refresh" onclick="carregarDados()">↻ Atualizar</button>
                <a href="/api/admin/exportar" target="_blank">
    <button style="background-color: #22c55e; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;">
        📊 Baixar Relatório (Excel)
    </button>
</a>
            </div>
        </div>

        <div class="cards-grid">
            <div class="card-resumo azul">
                <span class="card-titulo">Total de Inscritos</span>
                <h2 class="card-valor" id="total-inscritos">0</h2>
            </div>
            <div class="card-resumo verde">
                <span class="card-titulo">Status do Sistema</span>
                <h2 class="card-valor" style="font-size: 24px; padding-top: 10px; color: #4ade80;">Supabase Online</h2>
            </div>
        </div>

        <div class="tabela-container">
            <table>
                <thead>
                    <tr>
                        <th>Ticket</th>
                        <th>Nome do Participante</th>
                        <th>CPF</th>
                        <th>WhatsApp</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-corpo">
                    <tr><td colspan="6" style="text-align: center; color: var(--texto-mutado);">Carregando dados...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function carregarDados() {
            const tbody = document.getElementById('tabela-corpo');
            const contador = document.getElementById('total-inscritos');
            
            try {
                const res = await fetch('/api/admin/listar'); 
                
                if (res.ok) {
                    const dados = await res.json();
                    contador.textContent = dados.length;
                    tbody.innerHTML = '';

                    if (dados.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--texto-mutado);">Nenhuma inscrição encontrada.</td></tr>';
                        return;
                    }

                    dados.forEach(inscrito => {
                        const tr = document.createElement('tr');
                        tr.innerHTML = `
                            <td style="font-weight: bold; color: var(--azul-senai);">#${String(inscrito.id).padStart(3, '0')}</td>
                            <td style="font-weight: 600;">${inscrito.nome}</td>
                            <td>${inscrito.cpf}</td>
                            <td>${inscrito.whatsapp}</td>
                            <td><span class="status-badge">Confirmado</span></td>
                            <td>
                                <button class="btn-deletar" onclick="deletarInscricao(${inscrito.id}, '${inscrito.nome}')">✕ Excluir</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                }
            } catch (err) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: var(--vermelho-senai);">Erro ao conectar com o servidor.</td></tr>';
            }
        }

        async function deletarInscricao(id, nome) {
            if (!confirm(`Tem certeza que deseja excluir a inscrição de ${nome}?`)) return;

            try {
                const res = await fetch(`/api/admin/deletar/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    carregarDados();
                } else {
                    alert('Erro ao excluir inscrição.');
                }
            } catch (err) {
                alert('Erro de conexão com o servidor.');
            }
        }

        carregarDados();
    </script>
</body>
</html>
