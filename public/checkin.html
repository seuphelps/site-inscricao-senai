<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portaria - Admin 2.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <!-- Biblioteca mágica do leitor de QR Code -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            color: #fff;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h2 { color: #005baa; text-transform: uppercase; }
        #reader {
            width: 100%;
            max-width: 500px;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #2a2a2a;
            background: #111;
        }
        #resultado {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            max-width: 460px;
            font-size: 18px;
            font-weight: bold;
            display: none;
        }
        .sucesso { background-color: rgba(34, 197, 94, 0.2); border: 1px solid #22c55e; color: #22c55e; }
        .erro { background-color: rgba(239, 68, 68, 0.2); border: 1px solid #ef4444; color: #ef4444; }
    </style>
</head>
<body>

    <h2>Check-in Portaria</h2>
    <p style="color: #888; margin-bottom: 20px; text-align: center;">Aponte a câmera para o ingresso</p>

    <!-- Onde a câmera vai aparecer -->
    <div id="reader"></div>

    <!-- Mensagem de sucesso ou erro -->
    <div id="resultado"></div>

    <script>
        const resultadoDiv = document.getElementById('resultado');
        let lendo = true; // Trava de segurança para não ler o mesmo QR Code 50 vezes num segundo

        async function onScanSuccess(decodedText, decodedResult) {
            if (!lendo) return; // Se já está processando um ingresso, ignora
            lendo = false; 

            // decodedText vai ser o ID que guardamos no QR Code
            try {
                const res = await fetch('/api/checkin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: decodedText })
                });

                const dados = await res.json();

                resultadoDiv.style.display = 'block';
                if (res.ok) {
                    resultadoDiv.className = 'sucesso';
                    resultadoDiv.innerHTML = `✅ ACESSO LIBERADO<br><span style="color:#fff; font-size:16px;">${dados.nome}</span>`;
                    
                    // Emite um "bip" de sucesso!
                    new Audio('https://www.myinstants.com/media/sounds/success-sound-effect.mp3').play();
                } else {
                    resultadoDiv.className = 'erro';
                    resultadoDiv.innerHTML = `❌ ERRO<br><span style="color:#fff; font-size:16px;">${dados.erro}</span>`;
                }

            } catch (err) {
                resultadoDiv.style.display = 'block';
                resultadoDiv.className = 'erro';
                resultadoDiv.innerHTML = '❌ Erro de conexão!';
            }

            // Pausa de 3 segundos antes de poder ler o próximo QR Code
            setTimeout(() => {
                resultadoDiv.style.display = 'none';
                lendo = true;
            }, 3000);
        }

        // Configura e liga a câmera automaticamente
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", 
            { fps: 10, qrbox: {width: 250, height: 250} }, 
            false
        );
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
