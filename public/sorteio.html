<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio - Admin 4.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --fundo-escuro: #0a0a0a;
            --azul-senai: #005baa;
            --texto-claro: #f0f4f8;
            --borda: #2a2a2a;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--fundo-escuro);
            color: var(--texto-claro);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .sorteio-container {
            background: #141414;
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(0, 91, 170, 0.2);
        }

        .brinde-img {
            width: 150px;
            height: 150px;
            background-color: #1a1a1a;
            border: 2px dashed var(--borda);
            border-radius: 12px;
            margin: 0 auto 20px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 14px;
        }

        .nome-roleta {
            font-size: 32px;
            font-weight: 800;
            height: 50px;
            margin: 20px 0;
            color: var(--azul-senai);
        }

        .ticket-ganhador {
            font-size: 18px;
            color: #888;
            margin-bottom: 30px;
            height: 25px;
        }

        button {
            background-color: var(--azul-senai);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            width: 100%;
        }

        button:hover { background-color: #004280; }
        button:disabled { background-color: #333; cursor: not-allowed; }
    </style>
</head>
<body>

    <div class="sorteio-container">
        <h2>Hora do Sorteio!</h2>
        <p style="color: #888;">Brinde: Kit Exclusivo SENAI</p>
        
        <div class="brinde-img">
            [ Imagem do Brinde ]
        </div>

        <div class="nome-roleta" id="nome-display">Preparado?</div>
        <div class="ticket-ganhador" id="ticket-display"></div>

        <button id="btn-sortear" onclick="iniciarSorteio()">Sortear Ganhador</button>
    </div>

    <script>
        let participantes = [];

        // Carrega os participantes ao abrir a página
        async function carregarParticipantes() {
            try {
                const res = await fetch('/api/sorteio/participantes');
                if (res.ok) participantes = await res.json();
            } catch (err) {
                console.error("Erro ao carregar");
            }
        }

        async function iniciarSorteio() {
            if (participantes.length === 0) return alert("Nenhum participante encontrado!");

            const btn = document.getElementById('btn-sortear');
            const displayNome = document.getElementById('nome-display');
            const displayTicket = document.getElementById('ticket-display');
            
            btn.disabled = true;
            btn.textContent = "Sorteando...";
            displayTicket.textContent = "";

            let contador = 0;
            // Efeito de "roleta" rodando os nomes
            const intervalo = setInterval(() => {
                const random = participantes[Math.floor(Math.random() * participantes.length)];
                displayNome.textContent = random.nome;
                contador++;

                // Para a roleta após 30 giros (aprox 3 segundos)
                if (contador > 30) {
                    clearInterval(intervalo);
                    const ganhador = participantes[Math.floor(Math.random() * participantes.length)];
                    displayNome.textContent = ganhador.nome;
                    displayTicket.textContent = `Ticket: #${String(ganhador.id).padStart(3, '0')}`;
                    displayNome.style.color = "#22c55e"; // Fica verde
                    btn.textContent = "Sortear Novamente";
                    btn.disabled = false;
                }
            }, 100); // Velocidade da troca de nomes
        }

        carregarParticipantes();
    </script>
</body>
</html>
