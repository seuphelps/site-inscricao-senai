<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta de Prêmios - Admin 4.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --fundo-escuro: #0a0a0a;
            --fundo-card: #141414;
            --azul-senai: #005baa;
            --texto-claro: #f0f4f8;
            --borda: #2a2a2a;
            --destaque-verde: #22c55e;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--fundo-escuro);
            color: var(--texto-claro);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            background-color: var(--fundo-card);
            border: 1px solid var(--borda);
            border-radius: 16px;
            padding: 50px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 10px 40px rgba(0, 91, 170, 0.15);
        }

        .titulo {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
        }

        .display-box {
            background-color: #0a0a0a;
            border: 2px solid var(--borda);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .display-brinde { color: var(--destaque-verde); font-size: 28px; font-weight: 800; }
        .display-nome { color: var(--azul-senai); font-size: 32px; font-weight: 800; }
        .ticket { color: #666; font-size: 14px; margin-top: -10px; margin-bottom: 20px; height: 20px; }

        .btn-sortear {
            background-color: var(--azul-senai);
            color: white;
            border: none;
            padding: 18px 40px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-transform: uppercase;
        }

        .btn-sortear:hover { background-color: #004280; transform: translateY(-2px); }
        .btn-sortear:disabled { background-color: #333; color: #666; cursor: not-allowed; transform: none; }

        .restantes { margin-top: 20px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

    <div class="container">
        <div class="titulo">Sorteio Oficial</div>
        
        <div class="display-box">
            <div class="display-brinde" id="brinde-txt">🎁 Aguardando...</div>
        </div>

        <div class="display-box" style="height: 80px;">
            <div class="display-nome" id="nome-txt">? ? ?</div>
        </div>
        <div class="ticket" id="ticket-txt"></div>

        <button class="btn-sortear" id="btn-iniciar" onclick="iniciarRoleta()">Rodar Roleta</button>
        <div class="restantes" id="status-brindes">Prêmios disponíveis: Carregando...</div>
    </div>

    <script>
        // Configuração dos Áudios
        const somSuspense = new Audio('./audios/suspense.mp3');
        const somVitoria = new Audio('./audios/vitoria.mp3');
        somSuspense.loop = true; // O suspense fica tocando em loop até a gente mandar parar

        // Lista de Brindes (Deixei 4 de exemplo)
        let listaBrindes = [
            "Brinde Surpresa 1",
            "Brinde Surpresa 2",
            "Brinde Surpresa 3",
            "Brinde Surpresa 4"
        ];
        
        let participantes = [];
        
        const brindeTxt = document.getElementById('brinde-txt');
        const nomeTxt = document.getElementById('nome-txt');
        const ticketTxt = document.getElementById('ticket-txt');
        const btn = document.getElementById('btn-iniciar');
        const statusBrindes = document.getElementById('status-brindes');

        async function carregarDados() {
            try {
                const res = await fetch('/api/sorteio/participantes');
                if (res.ok) participantes = await res.json();
                atualizarStatus();
            } catch (err) {
                alert("Erro ao carregar participantes.");
            }
        }

        function atualizarStatus() {
            statusBrindes.textContent = `Prêmios disponíveis: ${listaBrindes.length} | Participantes: ${participantes.length}`;
            if (listaBrindes.length === 0) {
                btn.disabled = true;
                btn.textContent = "Sorteio Encerrado";
                brindeTxt.textContent = "Todos os prêmios sorteados!";
            }
        }

        function animarRoleta(elemento, arrayOpcoes, duracao, callback) {
            let contador = 0;
            let velocidade = 50; 
            const totalGiros = duracao / velocidade;

            const intervalo = setInterval(() => {
                const itemAleatorio = arrayOpcoes[Math.floor(Math.random() * arrayOpcoes.length)];
                elemento.textContent = itemAleatorio.nome || itemAleatorio;
                contador++;

                if (contador >= totalGiros) {
                    clearInterval(intervalo);
                    const itemVencedor = arrayOpcoes[Math.floor(Math.random() * arrayOpcoes.length)];
                    callback(itemVencedor);
                }
            }, velocidade);
        }

        function iniciarRoleta() {
            if (participantes.length === 0) return alert("Nenhum inscrito para sortear!");
            if (listaBrindes.length === 0) return;

            // Inicia o som de suspense
            somSuspense.currentTime = 0; // Zera o áudio caso já tenha tocado
            somSuspense.play();

            btn.disabled = true;
            btn.textContent = "Sorteando Prêmio...";
            nomeTxt.textContent = "----------";
            ticketTxt.textContent = "";

            animarRoleta(brindeTxt, listaBrindes, 2000, (brindeSorteado) => {
                brindeTxt.textContent = `🎁 ${brindeSorteado}`;
                listaBrindes = listaBrindes.filter(b => b !== brindeSorteado);
                atualizarStatus();

                btn.textContent = "Sorteando Ganhador...";
                
                setTimeout(() => {
                    animarRoleta(nomeTxt, participantes, 3500, (ganhador) => {
                        // Para o suspense e toca a comemoração
                        somSuspense.pause();
                        somVitoria.currentTime = 0;
                        somVitoria.play();

                        nomeTxt.textContent = ganhador.nome;
                        ticketTxt.textContent = `Ticket: #${String(ganhador.id).padStart(3, '0')}`;
                        
                        btn.textContent = "Rodar Novamente";
                        btn.disabled = false;
                    });
                }, 500); 
            });
        }

        carregarDados();
    </script>
</body>
</html>
