<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio Oficial - Admin 4.0</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
    <!-- Biblioteca mágica de confetes -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --azul-senai: #005baa;
            --azul-claro: #0088ff;
            --verde-neon: #22c55e;
            --fundo-escuro: #050505;
        }

        body {
            font-family: 'Inter', sans-serif;
            /* Fundo com um brilho radial central */
            background: radial-gradient(circle at center, #0a192f 0%, var(--fundo-escuro) 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Evita rolagem na tela do telão */
        }

        .container {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 91, 170, 0.4);
            border-radius: 24px;
            padding: 60px 40px;
            width: 100%;
            max-width: 800px;
            text-align: center;
            box-shadow: 0 0 60px rgba(0, 91, 170, 0.2);
        }

        .titulo {
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: var(--azul-claro);
            text-shadow: 0 0 20px rgba(0, 136, 255, 0.5);
        }

        /* Displays estilo Painel Eletrônico */
        .display-box {
            background: linear-gradient(145deg, #111, #000);
            border: 2px solid var(--azul-senai);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.8), 0 0 20px rgba(0, 91, 170, 0.3);
        }

        /* Tamanhos gigantes para o telão */
        .display-brinde { 
            color: var(--verde-neon); 
            font-size: 40px; 
            font-weight: 900; 
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
        }

        .display-nome { 
            color: #fff; 
            font-size: 56px; /* Nome gigante */
            font-weight: 900; 
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .ticket { 
            color: var(--azul-claro); 
            font-size: 24px; 
            font-weight: 600;
            margin-top: -15px; 
            margin-bottom: 30px; 
            height: 30px; 
            letter-spacing: 2px;
        }

        /* Efeito de pulsar no ganhador */
        .vencedor-destaque {
            animation: pulsar 1s infinite alternate;
            color: var(--verde-neon);
            text-shadow: 0 0 30px var(--verde-neon);
        }

        @keyframes pulsar {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        .btn-sortear {
            background: linear-gradient(90deg, var(--azul-senai), var(--azul-claro));
            color: white;
            border: none;
            padding: 20px 50px;
            font-size: 24px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0, 91, 170, 0.4);
        }

        .btn-sortear:hover { transform: scale(1.05); box-shadow: 0 15px 30px rgba(0, 91, 170, 0.6); }
        .btn-sortear:disabled { background: #333; color: #666; cursor: not-allowed; transform: none; box-shadow: none; }

        .restantes { margin-top: 30px; font-size: 16px; color: #888; font-weight: 600; }
    </style>
</head>
<body>

    <div class="container">
        <div class="titulo">Momento Premiado</div>
        
        <!-- Roleta do Brinde -->
        <div class="display-box" style="height: 80px;">
            <div class="display-brinde" id="brinde-txt">🎁 Preparando...</div>
        </div>

        <!-- Roleta do Ganhador -->
        <div class="display-box" style="height: 120px;">
            <div class="display-nome" id="nome-txt">Sorteio ADMIN 4.0</div>
        </div>
        <div class="ticket" id="ticket-txt"></div>

        <button class="btn-sortear" id="btn-iniciar" onclick="iniciarRoleta()">Sortear Agora</button>
        <div class="restantes" id="status-brindes">Conectando ao banco de dados...</div>
    </div>

    <script>
        const somSuspense = new Audio('./audios/suspense.mp3');
        const somVitoria = new Audio('./audios/vitoria.mp3');
        somSuspense.loop = true;

        let listaBrindes = [
            "Copo Térmico Oficial",
            "Mochila Executiva",
            "Kit Ferramentas",
            "Powerbank 10.000mAh"
        ];
        
        let participantes = [];
        
        const brindeTxt = document.getElementById('brinde-txt');
        const nomeTxt = document.getElementById('nome-txt');
        const ticketTxt = document.getElementById('ticket-txt');
        const btn = document.getElementById('btn-iniciar');
        const statusBrindes = document.getElementById('status-brindes');

        async function carregarDados() {
            try {
                const res = await fetch('/api/sorteio/participantes');
                if (res.ok) participantes = await res.json();
                atualizarStatus();
            } catch (err) {
                statusBrindes.textContent = "Erro de conexão.";
            }
        }

        function atualizarStatus() {
            statusBrindes.textContent = `Prêmios disponíveis: ${listaBrindes.length} | Participantes: ${participantes.length}`;
            if (listaBrindes.length === 0) {
                btn.disabled = true;
                btn.textContent = "Sorteios Encerrados";
                brindeTxt.textContent = "Todos os prêmios entregues!";
            }
        }

        function animarRoleta(elemento, arrayOpcoes, duracao, callback) {
            let contador = 0;
            let velocidade = 50; 
            const totalGiros = duracao / velocidade;
            elemento.classList.remove('vencedor-destaque'); // Remove o brilho verde se tiver

            const intervalo = setInterval(() => {
                const itemAleatorio = arrayOpcoes[Math.floor(Math.random() * arrayOpcoes.length)];
                elemento.textContent = itemAleatorio.nome || itemAleatorio;
                contador++;

                if (contador >= totalGiros) {
                    clearInterval(intervalo);
                    const itemVencedor = arrayOpcoes[Math.floor(Math.random() * arrayOpcoes.length)];
                    callback(itemVencedor);
                }
            }, velocidade);
        }

        function soltarConfetes() {
            var duration = 3 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#005baa', '#22c55e', '#ffffff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#005baa', '#22c55e', '#ffffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function iniciarRoleta() {
            if (participantes.length === 0) return alert("Nenhum inscrito para sortear!");
            if (listaBrindes.length === 0) return;

            somSuspense.currentTime = 0;
            somSuspense.play();

            btn.disabled = true;
            btn.textContent = "Sorteando...";
            nomeTxt.textContent = "----------";
            ticketTxt.textContent = "";
            nomeTxt.classList.remove('vencedor-destaque');

            // Etapa 1: Brinde
            animarRoleta(brindeTxt, listaBrindes, 2000, (brindeSorteado) => {
                brindeTxt.textContent = `🎁 ${brindeSorteado}`;
                listaBrindes = listaBrindes.filter(b => b !== brindeSorteado);
                atualizarStatus();

                // Etapa 2: Nome
                setTimeout(() => {
                    animarRoleta(nomeTxt, participantes, 3500, (ganhador) => {
                        somSuspense.pause();
                        somVitoria.currentTime = 0;
                        somVitoria.play();
                        
                        // Chama a explosão de confetes!
                        soltarConfetes();

                        nomeTxt.textContent = ganhador.nome;
                        nomeTxt.classList.add('vencedor-destaque'); // Adiciona brilho verde pulsante
                        ticketTxt.textContent = `TICKET: #${String(ganhador.id).padStart(3, '0')}`;
                        
                        btn.textContent = "Sortear Próximo";
                        btn.disabled = false;
                    });
                }, 500); 
            });
        }

        carregarDados();
    </script>
</body>
</html>
